<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
    <title>主线笔记可靠性测试版</title>
    <link rel="stylesheet" href="account.css" />
  </head>
  <body>
    <main class="account-shell">
      <section class="intro-card">
        <div class="preview-mark">登录测试副本</div>
        <h1>主线笔记</h1>
        <p>每个微信账号拥有独立的电脑资料、附件、缓存和离线同步队列。</p>
        <div class="privacy-note">登录完成前不会加载任何笔记。首次连接会先接收该微信账号的云端数据，确认完成后才允许电脑上传。</div>
      </section>

      <section class="account-card">
        <div class="section-heading">
          <div><span>这台电脑</span><h2>选择已连接账号</h2></div>
          <button id="refreshProfiles" class="quiet-button" type="button">刷新</button>
        </div>
        <div id="profileList" class="profile-list"></div>
        <div id="emptyProfiles" class="empty-state" hidden>还没有连接过微信账号</div>
      </section>

      <section class="account-card">
        <div class="section-heading"><div><span>首次连接</span><h2>用微信扫码登录</h2></div></div>
        <p class="helper">打开“主线随行笔记”小程序，点击“扫描电脑登录二维码”，然后确认电脑登录。</p>
        <form id="loginForm">
          <input id="endpoint" type="hidden" value="https://YOUR_CLOUDBASE_DOMAIN/desktop-sync" />
          <input id="deviceName" type="hidden" value="主线笔记可靠性测试版 Windows" />
          <button id="startLoginButton" class="primary-button" type="submit">生成登录二维码</button>
        </form>

        <div id="qrPanel" class="qr-panel" hidden>
          <img id="loginQr" class="login-qr" alt="微信扫码登录二维码" />
          <div class="qr-copy">
            <strong>等待手机确认</strong>
            <span id="qrExpiry"></span>
            <p>电脑会在二维码十分钟有效期内低频检查登录结果。手机确认较晚时，也可以点击下面按钮立即检查。</p>
            <div class="qr-actions">
              <button id="completeLoginButton" class="primary-button" type="button">我已在手机确认</button>
              <button id="cancelLoginButton" class="quiet-button" type="button">取消</button>
            </div>
          </div>
        </div>

        <div id="accountMessage" class="message" role="status"></div>
      </section>
    </main>
    <script src="account.js"></script>
  </body>
</html>
